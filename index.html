<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-visual" />
    <meta name="description" content="A quiet place to type. Live words per minute, accuracy, consistency and text stats, computed in your browser." />
    <meta name="theme-color" content="#05070B" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>mnmltype — live typing stats</title>
  </head>
  <body>
    <div class="ambient" aria-hidden="true"><div class="ambient-core"></div></div>

    <div class="app">
      <header class="hdr">
        <h1 class="mark">mnml<span class="mark-dot">.</span>type</h1>
        <div class="hdr-r">
          <span class="pill"><span class="pill-v"></span><span class="pill-k">wpm</span></span>
          <button class="btn" id="reset" type="button">Reset</button>
        </div>
        <span class="focus-line" aria-hidden="true"></span>
      </header>

      <main class="main">
        <div class="editor-wrap">
          <div class="editor-col">
          <svg class="frame" aria-hidden="true" focusable="false">
            <rect class="frame-rest" width="100%" height="100%" rx="10" pathLength="1"></rect>
            <rect class="frame-draw" width="100%" height="100%" rx="10" pathLength="1"></rect>
          </svg>
          <label class="sr-only" for="editor">Text editor. Type here to measure your typing.</label>
          <textarea
            id="editor"
            class="editor"
            placeholder="Start typing…"
            spellcheck="false"
            autocorrect="off"
            autocapitalize="off"
            autocomplete="off"
          ></textarea>
          </div>
        </div>

        <aside class="panel" id="panel" aria-label="Typing statistics" tabindex="0">
          <div class="sheet-head">
            <div>
              <h2 class="sheet-title" id="sheet-title">Statistics</h2>
              <p class="sheet-time"><span class="t-active">0:00</span> active · <span class="t-elapsed">0:00</span> elapsed</p>
            </div>
            <button class="sheet-close" id="sheet-close" type="button" aria-label="Close statistics">
              <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"></path></svg>
            </button>
          </div>
          <div class="panel-body" id="panel-body"></div>
        </aside>
      </main>

      <footer class="ftr">
        <span class="ftr-time"><span class="t-active">0:00</span> active · <span class="t-elapsed">0:00</span> elapsed</span>
        <span class="status" id="status"><span class="sr-only">Status: </span><span class="status-dot" aria-hidden="true"></span><span class="status-t">idle</span></span>
      </footer>
    </div>

    <div class="scrim" id="scrim" aria-hidden="true"></div>
    <button class="bar" id="bar" type="button" aria-expanded="false" aria-controls="panel">
      <span class="sr-only">Show all statistics. </span>
      <span class="bar-i"><span class="bar-k">WPM</span><span class="bar-v"></span></span>
      <span class="bar-i"><span class="bar-k">Acc</span><span class="bar-v"></span></span>
      <span class="bar-i"><span class="bar-k">Words</span><span class="bar-v"></span></span>
      <svg class="bar-chev" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </button>

    <p class="sr-only" id="summary" aria-live="polite"></p>
    <p class="sr-only" id="notice" aria-live="polite"></p>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
